services:
  python-backend:
    build:
      context: .
      dockerfile: server_py/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db  # keep if a DB exists; remove if not
# Note: This adds a new python-backend service. The existing Node service is left untouched
# so you can run both side-by-side during migration.